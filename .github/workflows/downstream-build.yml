name: Downstream x64 build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wpf-x64:
    name: Build WPF (GitHub Release, x64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore WPF project
        run: dotnet restore FluentFlyoutWPF/FluentFlyout.csproj -p:Platform=x64

      - name: Restore focused tests
        run: dotnet restore tests/FluentFlyoutWPF.Tests/FluentFlyoutWPF.Tests.csproj -p:Platform=x64

      - name: Build WPF project
        run: dotnet build FluentFlyoutWPF/FluentFlyout.csproj -c "GitHub Release" -p:Platform=x64 -p:DownstreamBuildChannel=development -p:DownstreamSourceRevision=${{ github.sha }} --no-restore

      - name: Run focused production behavior tests
        run: dotnet test tests/FluentFlyoutWPF.Tests/FluentFlyoutWPF.Tests.csproj -c "GitHub Release" -p:Platform=x64 -p:DownstreamBuildChannel=development -p:DownstreamSourceRevision=${{ github.sha }} --no-restore

      - name: Validate downstream package (no release mutation)
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'FluentFlyoutDownstream-development-win-x64.zip'
          & .\scripts\Build-DownstreamZip.ps1 `
            -Channel development `
            -ExpectedCommit $env:GITHUB_SHA `
            -ArchivePath $archive
