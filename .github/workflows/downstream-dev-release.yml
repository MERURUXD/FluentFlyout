name: Downstream dev release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: downstream-dev-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-dev:
    name: Build downstream ZIP (x64)
    if: >-
      github.repository == 'MERURUXD/FluentFlyout' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Extract downstream version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content 'FluentFlyoutMSIX\Package.appxmanifest'
          $fullVersion = [string]$manifest.Package.Identity.Version
          if ($fullVersion -notmatch '^\d+\.\d+\.\d+\.0$') {
            throw "Expected a MAJOR.MINOR.PATCH.0 version in Package.appxmanifest, got '$fullVersion'."
          }

          $version = ($fullVersion -split '\.')[0..2] -join '.'
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore WPF publish inputs
        run: dotnet restore FluentFlyoutWPF/FluentFlyout.csproj -p:Platform=x64 -r win-x64

      - name: Publish self-contained WPF build
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'FluentFlyoutDownstream-dev-win-x64'
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null

          dotnet publish FluentFlyoutWPF/FluentFlyout.csproj `
            --configuration 'GitHub Release' `
            --framework net10.0-windows10.0.22000.0 `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output $publishDir `
            -p:Platform=x64 `
            -p:Version=$env:APP_VERSION

          if (-not (Test-Path (Join-Path $publishDir 'FluentFlyoutDownstream.exe'))) {
            throw 'The downstream executable was not produced.'
          }

          $archivePath = Join-Path $env:RUNNER_TEMP 'FluentFlyoutDownstream-dev-win-x64.zip'
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $archivePath -Force

      - name: Upload release archive for the publisher
        uses: actions/upload-artifact@v4
        with:
          name: FluentFlyoutDownstream-dev-win-x64
          path: ${{ runner.temp }}/FluentFlyoutDownstream-dev-win-x64.zip
          if-no-files-found: error

  publish-dev:
    name: Publish rolling dev release
    needs: build-dev
    if: >-
      github.repository == 'MERURUXD/FluentFlyout' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: FluentFlyoutDownstream-dev-win-x64
          path: ${{ runner.temp }}/downstream-release

      - name: Move dev tag and publish rolling release
        shell: pwsh
        run: |
          $archive = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'downstream-release') -Filter '*.zip' | Select-Object -First 1
          if ($null -eq $archive) {
            throw 'The release archive was not downloaded.'
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --force dev $env:GITHUB_SHA
          git push origin '+refs/tags/dev:refs/tags/dev'

          $notesPath = Join-Path $env:RUNNER_TEMP 'dev-release-notes.md'
          @"
          Rolling downstream development build.

          Commit: $env:GITHUB_SHA
          This prerelease is replaced by the next successful master build.
          Stable releases are published manually with immutable vMAJOR.MINOR.PATCH tags.
          "@ | Set-Content -Path $notesPath -Encoding utf8

          gh release view dev --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit dev `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "FluentFlyout Downstream dev ($($env:GITHUB_SHA.Substring(0, 7)))" `
              --notes-file $notesPath `
              --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Failed to refresh the rolling dev release.' }

            gh release upload dev $archive.FullName --repo $env:GITHUB_REPOSITORY --clobber
          }
          else {
            gh release create dev $archive.FullName `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "FluentFlyout Downstream dev ($($env:GITHUB_SHA.Substring(0, 7)))" `
              --notes-file $notesPath `
              --prerelease
          }

          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the rolling dev release.' }
