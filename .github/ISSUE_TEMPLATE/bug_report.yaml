name: Bug report
description: Report a reproducible issue in the downstream build
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please use this form for the MERURUXD/FluentFlyout downstream build.
        For the official product, use the [upstream issue tracker](https://github.com/unchihugo/FluentFlyout/issues).
        Remove account names, personal paths, media titles, tokens, and other personal information before posting.

  - type: checkboxes
    id: prior-search
    attributes:
      label: Before reporting
      options:
        - label: I searched the [downstream issues](https://github.com/MERURUXD/FluentFlyout/issues?q=is%3Aissue+is%3Aopen) for a duplicate.
          required: true
        - label: I checked the current [downstream README](https://github.com/MERURUXD/FluentFlyout/blob/master/README.md) and release scope.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: State what happened, what you expected, and whether it is reproducible.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the media/app state, settings, and whether the issue follows enable-then-disable or restart/recovery.
      placeholder: |
        1. Start the downstream build with ...
        2. Enable ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: downstream-version
    attributes:
      label: Downstream version or channel
      description: For example, stable v2.15.0, rolling dev, or local source build.
      placeholder: v2.15.0 / dev / source
    validations:
      required: true

  - type: input
    id: commit-sha
    attributes:
      label: Commit SHA
      description: Optional for a stable ZIP; use the full SHA when reporting a source or development build.
      placeholder: 40-character commit SHA

  - type: input
    id: windows-version
    attributes:
      label: Windows version and build
      placeholder: Windows 11 25H2 / build 26xxx
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64 (not a supported downstream ZIP target)
        - Other
      default: 0
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Relevant settings and environment
      description: List only the settings needed to reproduce the issue. Do not paste the complete settings file.

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional. Attach only the smallest redacted excerpt needed to diagnose the issue; remove personal paths, account names, media data, and secrets.

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots and additional context
      description: Add screenshots, crash details, or links to a minimal public reproduction if needed.
