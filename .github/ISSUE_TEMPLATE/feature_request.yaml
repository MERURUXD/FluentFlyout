name: Feature request
description: Suggest an idea for this project
title: "[FEATURE REQUEST] Add Title Here"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for the MERURUXD/FluentFlyout downstream build. For a
        feature intended for the general product, use the [upstream issue tracker](https://github.com/unchihugo/FluentFlyout/issues).

        <p align="center">
        	<picture>
        		<source width="50%" alt="fluentflyout-title" media="(prefers-color-scheme: dark)" srcset="https://github.com/user-attachments/assets/daa2969f-8ad2-4832-8253-26133a50c921" />
        		<source width="50%" alt="fluentflyout-title" media="(prefers-color-scheme: light)" srcset="https://github.com/user-attachments/assets/3e75e514-b9a6-40e3-b170-af9d29a82bb4" />
        		<img width="50%" alt="fluentflyout-title" src="https://github.com/user-attachments/assets/daa2969f-8ad2-4832-8253-26133a50c921">
        	</picture>
        </p>

        # FluentFlyout Feature Request Form

        Before continuing, confirm that you have done the following:

        * I have searched the [downstream feature reports](https://github.com/MERURUXD/FluentFlyout/issues?q=is%3Aissue+is%3Aopen+label%3Aenhancement) for a duplicate
        * I have read the current [downstream README](https://github.com/MERURUXD/FluentFlyout/blob/master/README.md) and release scope

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "A clear and concise description of what you'd like to have."
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: "Add any other context or screenshots about the feature request here."
  - type: checkboxes
    id: checklist
    attributes:
      label: "Confirm that you have done the following:"
      options:
        - label: "I have searched that there is no existing downstream issue regarding my feature request"
          required: true
        - label: "I have read the downstream README and there is no existing answer to my feature request"
          required: true
